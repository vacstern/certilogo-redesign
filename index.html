<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Certilogo: Connecting Products with People for Brands</title>
  <meta name="description" content="The leading connected product and authentication platform for Fashion &amp; Luxury.">
  <meta name="theme-color" content="#08090c">

  <style>
    @font-face {
      font-family: 'Onest';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/onest-v11-latin-regular.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Onest';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('./fonts/onest-v11-latin-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Onest';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('./fonts/onest-v11-latin-600.woff2') format('woff2');
    }

    :root {
      --bg-base: #08090c;
      --fg-primary: #ffffff;
      --fg-muted: rgba(255, 255, 255, 0.92);
      --btn-primary-bg: #ffffff;
      --btn-primary-bg-hover: #e4e6eb;
      --btn-primary-bg-active: #d2d6de;
      --btn-primary-fg: #0b0d11;
      --btn-secondary-bg: rgba(255, 255, 255, 0.14);
      --btn-secondary-bg-hover: rgba(255, 255, 255, 0.24);
      --btn-secondary-bg-active: rgba(255, 255, 255, 0.3);
      --radius-md: 0.5rem;
      --transition-fast: 180ms ease;
      --max-width-container: 70rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 100%;
    }

    html,
    body {
      min-height: 100%;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--fg-primary);
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .media-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .media-layer__video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-layer::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8, 10, 14, 0.56) 0%,
        rgba(8, 10, 14, 0.44) 48%,
        rgba(8, 10, 14, 0.78) 100%
      );
    }

    .layout {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      max-width: var(--max-width-container);
      margin-inline: auto;
      padding-block-start: max(2rem, env(safe-area-inset-top));
      padding-block-end: max(2rem, env(safe-area-inset-bottom));
      padding-inline-start: max(1.5rem, env(safe-area-inset-left));
      padding-inline-end: max(1.5rem, env(safe-area-inset-right));
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      gap: 2.5rem;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 3rem;
      min-height: 3rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-md);
    }

    .brand-link__img {
      height: clamp(1.85rem, 3vw, 2.35rem);
      width: auto;
      display: block;
    }

    .split-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(2.5rem, 6vw, 5.5rem);
      align-items: stretch;
    }

    .pillar {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .pillar__title {
      font-size: clamp(1.625rem, 2.6vw, 2.25rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.025em;
      color: var(--fg-primary);
      margin-block-end: 1.5rem;
      text-wrap: balance;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
    }

    .pillar__actions {
      margin-block-start: auto;
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.01em;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .btn--primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
    }

    .btn--primary:hover {
      background-color: var(--btn-primary-bg-hover);
    }

    .btn--primary:active {
      background-color: var(--btn-primary-bg-active);
    }

    .btn--secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--fg-primary);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn--secondary:hover {
      background-color: var(--btn-secondary-bg-hover);
    }

    .btn--secondary:active {
      background-color: var(--btn-secondary-bg-active);
    }

    .brand-link:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--fg-primary);
      outline-offset: 3px;
    }

    .footer {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .tagline {
      max-width: 38rem;
      text-align: center;
      text-wrap: balance;
      font-size: clamp(1rem, 1.3vw, 1.125rem);
      line-height: 1.45;
      letter-spacing: -0.015em;
      color: var(--fg-muted);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    }

    .tagline__strong {
      font-weight: 600;
      color: var(--fg-primary);
    }

    @media (max-width: 56.25rem) {
      .layout {
        padding-block-start: max(1.75rem, env(safe-area-inset-top));
        padding-block-end: max(1.75rem, env(safe-area-inset-bottom));
        padding-inline-start: max(1.25rem, env(safe-area-inset-left));
        padding-inline-end: max(1.25rem, env(safe-area-inset-right));
        gap: 2rem;
      }

      .brand-link__img {
        height: 1.95rem;
      }

      .split-grid {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }

      .pillar__title {
        font-size: 1.5rem;
        margin-block-end: 1rem;
      }

      .pillar__actions {
        width: 100%;
        flex-direction: column;
        gap: 0.625rem;
      }

      .btn {
        min-width: 13.75rem;
        width: min(100%, 17.5rem);
        padding: 0.75rem 1.75rem;
      }

      .tagline {
        max-width: 21rem;
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="media-layer" aria-hidden="true">
    <video id="bgVideo" class="media-layer__video" src="./bg.mp4" autoplay muted loop playsinline tabindex="-1"></video>
  </div>

  <div class="layout">
    <header class="header">
      <a href="https://www.certilogo.com/" class="brand-link" aria-label="Certilogo Home">
        <img class="brand-link__img" src="./certilogo-logo-new.svg" alt="Certilogo">
      </a>
    </header>

    <main class="split-grid">
      <h1 class="sr-only">Certilogo — Check Authenticity and Business Solutions</h1>

      <section class="pillar" aria-labelledby="heading-auth">
        <h2 id="heading-auth" class="pillar__title">Check Authenticity</h2>
        <div class="pillar__actions">
          <a href="https://www.certilogo.com/code" class="btn btn--primary">Verify your product</a>
          <a href="https://discover.certilogo.com/help" class="btn btn--secondary">Need assistance?</a>
        </div>
      </section>

      <section class="pillar" aria-labelledby="heading-business">
        <h2 id="heading-business" class="pillar__title">Business solutions</h2>
        <div class="pillar__actions">
          <a href="https://discover.certilogo.com/" class="btn btn--primary">Discover more</a>
          <a href="https://discover.certilogo.com/book-a-demo" target="_blank" rel="noopener noreferrer" class="btn btn--secondary">Business inquiry</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="tagline">
        <strong class="tagline__strong">Connected products</strong> for a trusted and circular future.
      </p>
    </footer>
  </div>

  <script>
    (() => {
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const videoElement = document.getElementById('bgVideo');

      const syncVideoMotion = (event) => {
        if (!videoElement) return;
        if (event.matches) {
          videoElement.removeAttribute('autoplay');
          videoElement.pause();
        } else {
          videoElement.play().catch(() => {});
        }
      };

      syncVideoMotion(reducedMotionQuery);
      reducedMotionQuery.addEventListener('change', syncVideoMotion);
    })();
  </script>
</body>
</html>
